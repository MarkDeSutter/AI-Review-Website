<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewHub - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header / Navigation Bar -->
    <header class="header">
        <nav class="navbar">
            <div class="navbar-container">
                <div class="logo">
                    <a href="index.html" class="logo-link">
                        <h1>ReviewHub</h1>
                    </a>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <h2>Login to ReviewHub</h2>
            <p class="login-subtitle">Access your reviews and account</p>

            <form id="loginForm" class="login-form">
                <!-- Error Message -->
                <div id="errorMessage" class="error-message"></div>

                <!-- Username Input -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input" 
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Login</button>
            </form>

            <!-- Back to Home -->
            <div class="login-footer">
                <p>Don't have an account? <a href="index.html">Return home</a></p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 ReviewHub. All rights reserved.</p>
            <ul class="footer-links">
                <li><a href="#">Privacy Policy</a></li>
                <li><a href="#">Terms of Service</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </div>
    </footer>

    <!-- Auth & Login Scripts -->
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
